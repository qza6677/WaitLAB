name: WaitLAB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting and lint
        run: ruff check waitlab tests

      - name: Check types
        shell: pwsh
        run: |
          $output = @(& python -m mypy --config-file pyproject.toml --no-incremental waitlab 2>&1)
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            foreach ($line in $output) {
              Write-Output "::error title=mypy::$($line.ToString())"
            }
            throw "mypy failed with exit code $exitCode."
          }

  package:
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build portable package
        shell: pwsh
        run: .\build_release.ps1

      - name: Verify package version
        shell: pwsh
        run: |
          $version = ((Get-Content .\pyproject.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1) -replace '.*"([^"]+)".*', '$1')
          $portable = Get-Item .\release\WaitLAB.exe
          if ($portable.VersionInfo.FileVersion -ne $version) {
            throw "Portable package version $($portable.VersionInfo.FileVersion) does not match source version $version."
          }

      - name: Verify installer package
        shell: pwsh
        run: |
          $version = ((Get-Content .\pyproject.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1) -replace '.*"([^"]+)".*', '$1')
          $installer = Get-Item ".\release\WaitLAB-Setup-$version.exe"
          if ($installer.Length -le 0) { throw "Installer is empty: $($installer.FullName)" }
          $manifest = Get-Content .\release\SHA256SUMS.txt
          if (-not ($manifest -match [regex]::Escape($installer.Name))) {
            throw "Installer is missing from SHA256SUMS.txt."
          }
