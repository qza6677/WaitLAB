name: WaitLAB CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff mypy

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting and lint
        run: ruff check waitlab tests

      - name: Check types
        run: mypy waitlab

  package:
    runs-on: windows-latest
    needs: quality

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build portable package
        shell: pwsh
        run: .\build_release.ps1

      - name: Verify package version
        shell: pwsh
        run: |
          $version = ((Get-Content .\pyproject.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1) -replace '.*"([^"]+)".*', '$1')
          $portable = Get-Item .\release\WaitLAB.exe
          if ($portable.VersionInfo.FileVersion -ne $version) {
            throw "Portable package version $($portable.VersionInfo.FileVersion) does not match source version $version."
          }

