name: Release WaitLAB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows release
        shell: pwsh
        run: .\build_release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, for example v0.4.0."
          }
          $version = $tag.Substring(1)
          $installer = ".\release\WaitLAB-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not built: $installer"
          }
          gh release create $tag `
            $installer `
            .\release\WaitLAB.exe `
            .\release\SHA256SUMS.txt `
            --title "WaitLAB $tag" `
            --generate-notes
