name: Release WaitLAB

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version, for example v0.5.15"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install ruff==0.12.0 mypy==1.17.1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting and lint
        run: ruff check waitlab tests

      - name: Check types
        run: mypy waitlab

      - name: Build Windows release
        shell: pwsh
        run: .\build_release.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, for example v0.4.0."
          }
          $version = $tag.Substring(1)
          $sourceVersion = ((Get-Content .\pyproject.toml | Where-Object { $_ -match '^version\s*=' } | Select-Object -First 1) -replace '.*"([^"]+)".*', '$1')
          if ($version -ne $sourceVersion) {
            throw "Release tag $tag does not match pyproject.toml version $sourceVersion."
          }
          $installer = ".\release\WaitLAB-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Expected installer was not built: $installer"
          }
          $assets = @(
            $installer,
            ".\release\WaitLAB.exe",
            ".\release\SHA256SUMS.txt"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # A retry after a partially successful publish updates the same
            # release instead of failing because the tag already exists.
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets `
              --title "WaitLAB $tag" `
              --generate-notes
          }
