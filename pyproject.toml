[project]
name = "waitlab"
version = "0.5.4"
description = "A local Windows research companion that turns Codex wait time into focused microtasks."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.scripts]
waitlab = "waitlab.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
